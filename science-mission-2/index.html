<html lang="en">
<head>

  <meta name="description" content="Interactive Science study app for Camilo (grade 4, Aspaen Altamar): the atom, states of matter, changes of state, physical and chemical changes, the skeleton and the muscular system.">
  <title>Science Mission 2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2715%27%20fill%3D%27%232a9d8f%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2744%27%20font-family%3D%27Arial%27%20font-weight%3D%27900%27%20font-size%3D%2734%27%20text-anchor%3D%27middle%27%20fill%3D%27%23fff%27%3ESc%3C/text%3E%3C/svg%3E">
  <style>
:root {
  --navy: #15315b;
  --navy-dark: #0c2344;
  --accent: #2a9d8f;
  --accent-light: #dff5f1;
  --accent-ink: #17776b;
  --yellow: #ffc857;
  --ink: #18243a;
  --muted: #64738a;
  --paper: #f5f7fb;
  --white: #fff;
  --line: #dbe2ec;
  --success: #17845d;
  --error: #bd3d4d;
  --radius: 18px;
  --shadow: 0 18px 50px rgba(21, 49, 91, .09);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--ink); background: var(--paper); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; line-height: 1.6; }
button, select { font: inherit; }
button { cursor: pointer; }

.topbar { height: 84px; padding: 0 32px; background: var(--navy-dark); color: white; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
.brand { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 13px; }
.brand-mark { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--yellow); color: var(--navy-dark); font-weight: 900; font-size: 1.35rem; letter-spacing: -.04em; }
.brand strong, .brand small, .brand small b { display: block; }
.brand strong { font-size: 1.05rem; letter-spacing: .01em; }
.brand small { color: #bfcce0; font-size: .66rem; line-height: 1.3; letter-spacing: .03em; }
.brand small b { font-weight: 750; }
.progress-summary { width: min(340px, 38vw); font-size: .82rem; color: #d7e2ef; }
.progress-track, .question-progress { height: 7px; background: rgba(255,255,255,.16); border-radius: 99px; overflow: hidden; }
.progress-track { margin-top: 7px; }
.progress-track span, .question-progress span { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: inherit; transition: width .35s ease; }

.app-shell { min-height: calc(100vh - 84px); display: grid; grid-template-columns: 285px 1fr; }
.sidebar { padding: 30px 20px; background: white; border-right: 1px solid var(--line); position: sticky; top: 84px; height: calc(100vh - 84px); overflow-y: auto; }
.eyebrow, .card-label, .week-label { text-transform: uppercase; letter-spacing: .13em; font-weight: 800; font-size: .75rem; }
.eyebrow { margin: 0 12px 12px; color: var(--muted); }
#topicNav { display: grid; gap: 5px; }
.topic-button { width: 100%; border: 0; background: transparent; color: #47566e; padding: 11px 12px; border-radius: 12px; text-align: left; display: grid; grid-template-columns: 28px 1fr 18px; gap: 9px; align-items: center; font-size: .89rem; line-height: 1.25; }
.topic-button:hover { background: #f0f5fa; }
.topic-button.active { color: var(--navy); background: var(--accent-light); font-weight: 750; }
.topic-index { color: #7d899a; font-variant-numeric: tabular-nums; }
.topic-status { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #bac5d2; }
.topic-status.done { border-color: var(--success); background: var(--success); box-shadow: inset 0 0 0 3px white; }
.reset-button { border: 0; background: none; color: var(--muted); padding: 14px 12px; margin-top: 18px; font-size: .82rem; }
.reset-button:hover { color: var(--error); }
.reset-button.armed { color: var(--error); font-weight: 800; }

.main-content { width: min(100%, 1040px); margin: 0 auto; padding: 48px 54px 70px; }
.mobile-topic-picker { display: none; }
.lesson-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 28px; margin-bottom: 28px; }
.week-label { color: var(--accent-ink); margin: 0 0 7px; }
h1 { margin: 0; font-size: clamp(2.1rem, 4vw, 3.5rem); line-height: 1.04; letter-spacing: -.045em; color: var(--navy-dark); max-width: 760px; }
.topic-summary { color: var(--muted); font-size: 1.08rem; max-width: 720px; margin: 14px 0 0; }
.topic-number { font-size: 5.4rem; line-height: .9; font-weight: 900; color: #e1e7ef; letter-spacing: -.08em; }

.mode-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.mode-tab { border: 0; background: none; padding: 12px 18px; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 750; }
.mode-tab.active { color: var(--navy); border-color: var(--accent); }
.mode-tab span { font-size: .75rem; color: var(--success); margin-left: 5px; }
.hidden { display: none !important; }

.definition-card, .content-card, .question-card, .quiz-intro, .quiz-result, .lesson-visual { background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.definition-card { padding: 26px 30px; border-left: 7px solid var(--accent); }
.card-label { color: var(--accent-ink); }
.definition-card p { margin: 7px 0 0; font-size: 1.25rem; line-height: 1.5; font-weight: 650; }
.definition-card p b, .content-card b, .example-card b, .tip-card b { color: var(--accent-ink); }
.example-card b { color: var(--yellow); }
.lesson-visual { margin: 20px 0; padding: 25px 28px 28px; }
.lesson-visual h2 { margin: 0; color: var(--navy); }
.visual-block + .visual-block { margin-top: 26px; padding-top: 22px; border-top: 1px dashed var(--line); }
.visual-block > p { margin: 3px 0 18px; color: var(--muted); }
.info-icon .flag { width: 40px; margin: 0 auto 4px; }
.lesson-visual > p { margin: 3px 0 18px; color: var(--muted); }
.lesson-grid { display: grid; grid-template-columns: 1.18fr .82fr; gap: 20px; margin: 20px 0; }
.content-card { padding: 26px 28px; box-shadow: none; }
.content-card h2, .question-card h2, .quiz-intro h2, .quiz-result h2 { color: var(--navy); margin: 0 0 16px; line-height: 1.25; }
.steps-list { list-style: none; padding: 0; margin: 0; counter-reset: lesson-step; }
.steps-list li { counter-increment: lesson-step; display: grid; grid-template-columns: 30px 1fr; gap: 12px; margin-top: 14px; }
.steps-list li::before { content: counter(lesson-step); width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: var(--navy); color: white; font-weight: 800; font-size: .82rem; }
.example-card { background: var(--navy); color: #edf4ff; border: 0; position: relative; overflow: hidden; }
.example-card::after { content: "“"; position: absolute; right: 18px; bottom: -55px; font-family: Georgia, serif; font-size: 12rem; color: rgba(255,255,255,.08); }
.example-card h2 { color: var(--yellow); }
.example-card p { position: relative; z-index: 1; margin: 0; }
.example-card .flag { vertical-align: middle; width: 28px; height: auto; margin-right: 4px; border-radius: 3px; }
.tip-card { display: flex; gap: 16px; align-items: flex-start; padding: 20px 23px; border-radius: 15px; background: #fff6d9; border: 1px solid #f4dda0; }
.tip-card > span { color: #aa6d00; font-size: 1.4rem; }
.tip-card strong { color: #765000; }
.tip-card p { margin: 2px 0 0; }
.panel-actions { margin-top: 26px; display: flex; justify-content: flex-end; }

.primary-button, .secondary-button { border-radius: 12px; padding: 12px 20px; font-weight: 800; border: 2px solid var(--navy); }
.primary-button { background: var(--navy); color: white; }
.primary-button:hover { background: var(--accent); border-color: var(--accent); }
.secondary-button { background: white; color: var(--navy); }
.secondary-button:hover { background: #edf3f8; }

.quiz-intro, .quiz-result { text-align: center; padding: 50px 28px; }
.quiz-icon { width: 70px; height: 70px; display: grid; place-items: center; border-radius: 22px; margin: 0 auto 18px; background: var(--accent-light); color: var(--accent-ink); font-size: 2rem; font-weight: 900; transform: rotate(-4deg); }
.quiz-intro p { color: var(--muted); margin: -5px auto 24px; max-width: 520px; }
.quiz-meta { display: flex; justify-content: space-between; color: var(--muted); font-weight: 700; font-size: .88rem; }
.question-progress { background: #dce4ee; margin: 9px 0 20px; }
.question-progress span { background: var(--accent); }
.question-visual { margin-bottom: 20px; padding: 18px 20px; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
.question-visual-title { margin: 0 0 9px; color: var(--muted); font-size: .88rem; font-weight: 750; }
.question-card { padding: 30px; }
.question-context { display: inline-block; margin: 0 0 13px; padding: 9px 12px; border-radius: 10px; background: #f0f4f8; color: #526078; }
.question-context .flag { width: 30px; height: auto; vertical-align: middle; margin-right: 6px; border-radius: 3px; }
.answer-list { display: grid; gap: 11px; margin: 22px 0; }
.answer-button { text-align: left; border: 2px solid var(--line); background: white; color: var(--ink); border-radius: 13px; padding: 14px 16px; display: flex; gap: 13px; align-items: flex-start; }
.answer-button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
.answer-button .flag { width: 34px; height: auto; vertical-align: middle; border-radius: 3px; margin-right: 6px; }
.answer-letter { flex: 0 0 27px; width: 27px; height: 27px; display: grid; place-items: center; border-radius: 8px; background: #e9eef5; font-weight: 850; font-size: .82rem; }
.answer-button.correct { border-color: var(--success); background: #ecfaf4; }
.answer-button.wrong { border-color: var(--error); background: #fff0f2; }
.answer-button.correct .answer-letter { background: var(--success); color: white; }
.answer-button.wrong .answer-letter { background: var(--error); color: white; }
.feedback { padding: 15px 17px; border-radius: 12px; margin-bottom: 18px; }
.feedback.good { background: #e8f8f0; color: #126245; }
.feedback.bad { background: #fff0f2; color: #88313c; }
.feedback strong { display: block; }
.result-score { width: 106px; height: 106px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 50%; background: var(--navy); color: white; font-size: 1.85rem; font-weight: 900; border: 8px solid var(--accent-light); }
.quiz-result p { color: var(--muted); }
.result-actions { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }

/* ---- visuals ---- */
.flag { width: 100%; height: auto; border-radius: 6px; display: block; }
.big-flag { display: grid; justify-items: center; gap: 8px; }
.big-flag .flag { width: min(240px, 60%); box-shadow: 0 8px 22px rgba(21,49,91,.15); }
.big-flag span { font-weight: 800; color: var(--navy); }
.flag-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 12px; }
.flag-card { padding: 12px; border: 1px solid var(--line); border-radius: 14px; background: #f8fafc; display: grid; gap: 3px; text-align: center; }
.flag-card .flag { margin-bottom: 6px; }
.flag-card strong { color: var(--navy); font-size: .95rem; }
.flag-card span { color: var(--accent-ink); font-weight: 750; font-size: .84rem; }
.flag-card em { color: var(--muted); font-style: normal; font-size: .8rem; }
.table-wrap { overflow-x: auto; }
.study-table { width: 100%; border-collapse: collapse; font-size: .95rem; }
.study-table th { text-align: left; padding: 10px 12px; background: var(--navy); color: white; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.study-table th:first-child { border-radius: 10px 0 0 0; } .study-table th:last-child { border-radius: 0 10px 0 0; }
.study-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.study-table td.first { font-weight: 800; color: var(--navy); white-space: nowrap; }
.study-table tr:nth-child(even) td { background: #f8fafc; }
.study-table .flag { width: 30px; display: inline-block; vertical-align: middle; margin-right: 8px; border-radius: 3px; }
.study-table mark { background: var(--accent-light); color: var(--accent-ink); padding: 1px 5px; border-radius: 5px; font-weight: 800; }
.info-cards { display: grid; gap: 12px; }
.info-cards.cols-2 { grid-template-columns: repeat(2, 1fr); }
.info-cards.cols-3 { grid-template-columns: repeat(3, 1fr); }
.info-cards.cols-4 { grid-template-columns: repeat(4, 1fr); }
.info-card { --card: var(--accent); padding: 16px 17px; border: 1px solid var(--line); border-top: 5px solid var(--card); border-radius: 14px; background: #f8fafc; }
.info-icon { display: block; font-size: 1.6rem; margin-bottom: 6px; }
.info-card strong { display: block; color: var(--navy); font-size: 1rem; }
.info-card p { margin: 5px 0 0; color: #45546b; font-size: .9rem; line-height: 1.45; }
.info-card small { display: block; margin-top: 8px; color: var(--muted); font-size: .8rem; }
.compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.compare-col { --card: #64748b; padding: 18px; border-radius: 14px; border: 2px solid var(--card); background: white; }
.compare-col strong { display: block; color: var(--card); font-size: 1.05rem; }
.compare-col small { display: block; color: var(--muted); margin-bottom: 8px; }
.compare-col ul { margin: 8px 0 0; padding-left: 18px; color: #45546b; }
.compare-col li { margin-top: 5px; }
.atom-stage { display: grid; gap: 10px; }
.atom-svg { width: 100%; max-width: 560px; margin: 0 auto; display: block; }
.atom-svg .orbit { fill: none; stroke: #9ab0c3; stroke-width: 2.5; }
.atom-svg .lbl { font-weight: 850; font-size: 13px; fill: var(--navy); }
.atom-svg .sub { font-size: 11px; fill: var(--muted); font-weight: 650; }
.atom-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; font-size: .88rem; font-weight: 700; color: #45546b; }
.atom-legend i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; }
.states-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.states-grid.single { grid-template-columns: minmax(200px, 320px); justify-content: center; }
.state-card { border: 2px solid var(--line); border-radius: 16px; padding: 14px; background: white; text-align: center; }
.state-card.hi { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-light); }
.state-card header { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 1.05rem; color: var(--navy); margin-bottom: 8px; }
.state-card p { margin: 10px 0 0; font-size: .88rem; color: #45546b; line-height: 1.45; }
.particles { width: 100%; max-width: 170px; display: block; margin: 0 auto; background: #eef6fb; border: 2px solid #b8d4e6; border-radius: 10px; }
.particles circle { fill: #2a7fbf; }
.particles.solid circle { animation: vib .6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -37ms); }
.particles.liquid circle { animation: slide 2.6s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -300ms); }
.particles.gas circle { animation: fly 2.2s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -450ms); }
@keyframes vib { from { transform: translate(-1px, -1px); } to { transform: translate(1px, 1px); } }
@keyframes slide { from { transform: translate(-6px, 2px); } 50% { transform: translate(4px, -4px); } to { transform: translate(7px, 3px); } }
@keyframes fly { from { transform: translate(-16px, 12px); } 33% { transform: translate(10px, -14px); } 66% { transform: translate(-8px, -10px); } to { transform: translate(18px, 8px); } }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: 150px 1fr 110px; gap: 12px; align-items: center; font-weight: 750; }
.bar-label { color: var(--navy); }
.bar-track { height: 26px; background: #e6ecf3; border-radius: 8px; overflow: hidden; }
.bar-track span { display: block; height: 100%; border-radius: 8px; }
.bar-value { color: #45546b; font-size: .92rem; }
.bars-note { margin: 4px 0 0; color: var(--muted); font-size: .88rem; }
.orgchart { display: grid; gap: 14px; }
.org-top, .org-node { --card: var(--navy); padding: 14px 16px; border-radius: 14px; border: 2px solid var(--card); background: white; }
.org-top { text-align: center; background: var(--card); color: white; }
.org-top strong { display: block; font-size: 1.05rem; } .org-top span { font-size: .88rem; opacity: .9; }
.org-branches { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.org-node strong { display: block; color: var(--card); } .org-node span { font-size: .88rem; color: #45546b; }

@media (max-width: 850px) {
  .topbar { padding: 0 18px; }
  .progress-summary { width: 210px; }
  .app-shell { display: block; }
  .sidebar { display: none; }
  .main-content { padding: 30px 22px 55px; }
  .mobile-topic-picker { display: grid; gap: 6px; margin-bottom: 28px; color: var(--muted); font-size: .82rem; font-weight: 750; }
  .mobile-topic-picker select { width: 100%; background: white; border: 1px solid var(--line); border-radius: 12px; padding: 12px; color: var(--ink); }
  .lesson-grid { grid-template-columns: 1fr; }
  .topic-number { display: none; }
  .info-cards.cols-3, .info-cards.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .states-grid { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 1fr; gap: 4px; }
}
@media (max-width: 560px) {
  .topbar { height: auto; min-height: 78px; gap: 12px; padding: 10px 16px; }
  .brand small { display: none; }
  .progress-summary { width: 135px; font-size: .7rem; text-align: right; }
  .app-shell { min-height: calc(100vh - 78px); }
  h1 { font-size: 2.1rem; }
  .topic-summary { font-size: 1rem; }
  .definition-card, .content-card, .question-card, .lesson-visual { padding: 20px; }
  .definition-card p { font-size: 1.1rem; }
  .mode-tab { flex: 1; }
  .panel-actions .primary-button { width: 100%; }
  .result-actions { flex-direction: column; }
  .info-cards.cols-2, .info-cards.cols-3, .info-cards.cols-4 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

/* ---- number line ---- */
.numberline { width: 100%; max-width: 720px; display: block; margin: 0 auto; }
.nl-axis { stroke: #334155; stroke-width: 3; } .nl-arrow { fill: #334155; }
.nl-tick { stroke: #334155; stroke-width: 2; } .nl-tick.zero { stroke-width: 4; }
.nl-label { font-size: 15px; font-weight: 700; fill: #334155; } .nl-label.neg { fill: #bd3d4d; } .nl-label.hi { fill: var(--accent-ink); font-size: 17px; font-weight: 900; }
.nl-jump { fill: none; stroke-width: 3; stroke-dasharray: 6 4; } .nl-jump-label { font-size: 15px; font-weight: 800; } .nl-point-label { font-size: 12px; font-weight: 800; }
/* ---- scratch blocks ---- */
.scripts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.script > strong { display: block; color: var(--navy); margin-bottom: 8px; }
.script > small { display: block; margin-top: 8px; color: var(--muted); font-size: .82rem; }
.script-stack { display: grid; gap: 3px; justify-content: start; }
.sb, .sb-c .sb-top { color: #fff; font-weight: 700; font-size: .86rem; padding: 7px 12px; border-radius: 6px; width: max-content; max-width: 100%; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
.sb.hat { border-radius: 22px 22px 6px 6px; padding-top: 10px; }
.sb-c { border-radius: 6px; width: max-content; max-width: 100%; }
.sb-c .sb-top { box-shadow: none; border-radius: 6px 6px 0 0; }
.sb-inner { margin-left: 14px; background: #f5f7fb; padding: 3px 4px 3px 6px; display: grid; gap: 3px; justify-content: start; }
.sb-bottom { height: 12px; border-radius: 0 0 6px 6px; }
.blk-inline { display: inline-block; padding: 2px 9px; border-radius: 6px; color: #fff; font-weight: 700; font-size: .82rem; white-space: nowrap; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); vertical-align: middle; }
.cat-movimiento { background: #4C97FF; } .cat-apariencia { background: #9966FF; } .cat-sonido { background: #CF63CF; }
.cat-eventos { background: #FFBF00; color: #3a2a00 !important; } .cat-eventos .sb-top { color: #3a2a00; }
.cat-control { background: #FFAB19; } .cat-sensores { background: #5CB1D6; } .cat-operadores { background: #59C059; } .cat-variables { background: #FF8C1A; } .cat-lapiz { background: #0FBD8C; }
.info-cards.cols-5 { grid-template-columns: repeat(5, 1fr); }
.info-cards .info-icon svg { width: 40px; margin: 0 auto 4px; }
@media (max-width: 850px) { .info-cards.cols-5 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .info-cards.cols-5 { grid-template-columns: 1fr; } }

/* ---- reading passage ---- */
.passage { padding: 22px 26px; border-radius: 14px; background: #fffdf5; border: 1px solid #efe4c4; font-family: Georgia, "Times New Roman", serif; font-size: 1.08rem; line-height: 1.7; color: #2b3444; }
.passage h3 { margin: 0 0 10px; font-family: inherit; color: var(--navy); font-size: 1.35rem; }
.passage p { margin: 0 0 12px; } .passage p:last-child { margin-bottom: 0; }
.passage b { color: var(--accent-ink); }

/* ---- Science 2 visuals: changes-of-state cycle, classification chart, skeleton, arm muscles ---- */
.cycle { display: flex; align-items: stretch; gap: 10px; }
.cycle-state { flex: 1; min-width: 0; display: grid; place-items: center; gap: 2px; padding: 14px 8px; border: 2px solid var(--line); border-radius: 14px; background: #f8fafc; color: var(--navy); font-weight: 900; }
.cycle-state span { font-size: 1.6rem; }
.cycle-state.solid { border-color: #2a7fbf; } .cycle-state.liquid { border-color: #2a9d8f; } .cycle-state.gas { border-color: #9ab0c3; }
.cycle-arrows { display: grid; align-content: center; gap: 8px; text-align: center; font-size: .82rem; font-weight: 800; }
.cycle-arrows span { display: flex; align-items: center; justify-content: center; gap: 4px; }
.cycle-arrows i { font-style: normal; font-size: 1.4rem; line-height: 1; }
.warm { color: #c2410c; } .cool { color: #1d4ed8; }
.cycle-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; margin-top: 14px; font-weight: 750; font-size: .9rem; }
@media (max-width: 560px) {
  .cycle { flex-direction: column; }
  .cycle-arrows { grid-auto-flow: column; justify-content: center; gap: 24px; }
  .cycle-arrows i { display: inline-block; transform: rotate(90deg); }
}

.decision { display: grid; gap: 16px; }
.d-q { display: flex; gap: 10px; align-items: center; font-weight: 800; color: var(--navy); }
.d-q span { flex: 0 0 26px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; background: var(--navy); color: #fff; font-size: .8rem; }
.d-answers { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0 36px; }
.d-leaf, .d-next { padding: 8px 12px; border-radius: 10px; border: 2px solid #b8c4d3; font-size: .9rem; color: #45546b; background: #fff; }
.d-leaf.gas { border-color: #9ab0c3; background: #eef2f8; } .d-leaf.liquid { border-color: #2a7fbf; background: #eaf4fb; } .d-leaf.solid { border-color: #e4572e; background: #fdeee9; }
.d-leaf strong { color: var(--navy); }
.d-leaf em { font-style: normal; margin-left: 6px; text-transform: uppercase; font-size: .72rem; letter-spacing: .08em; font-weight: 800; }
.d-next { border-style: dashed; color: var(--muted); }

.skel { width: 100%; max-width: 400px; display: block; margin: 0 auto; }
.skel .bone { --f: #f1e2b6; --s: #9a7b45; }
.skel .out { stroke: var(--s); stroke-linecap: round; fill: none; }
.skel .in { stroke: var(--f); stroke-linecap: round; fill: none; }
.skel .shape > * { fill: var(--f); stroke: var(--s); stroke-width: 2; }
.skel .hi,
.skel:has(.t-skull:hover) .b-skull, .skel:has(.t-skull:focus) .b-skull,
.skel:has(.t-vertebra:hover) .b-vertebra, .skel:has(.t-vertebra:focus) .b-vertebra,
.skel:has(.t-sternum:hover) .b-sternum, .skel:has(.t-sternum:focus) .b-sternum,
.skel:has(.t-rib:hover) .b-rib, .skel:has(.t-rib:focus) .b-rib,
.skel:has(.t-humerus:hover) .b-humerus, .skel:has(.t-humerus:focus) .b-humerus,
.skel:has(.t-radius:hover) .b-radius, .skel:has(.t-radius:focus) .b-radius,
.skel:has(.t-ulna:hover) .b-ulna, .skel:has(.t-ulna:focus) .b-ulna,
.skel:has(.t-pelvis:hover) .b-pelvis, .skel:has(.t-pelvis:focus) .b-pelvis,
.skel:has(.t-femur:hover) .b-femur, .skel:has(.t-femur:focus) .b-femur,

.arm-toggle { position: relative; }
.arm-toggle input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.arm-toggle label { display: inline-block; margin: 0 8px 12px 0; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); font-weight: 800; color: var(--muted); cursor: pointer; background: #fff; }

  try { return JSON.parse(localStorage.getItem(CONFIG.storageKey)) || {}; }

/* ---------- Visual renderers (used by topics and questions) ---------- */

  },
  table(v) {
    return `<div class="table-wrap"><table class="study-table">${v.head ? `<thead><tr>${v.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>` : ""}

      ${lbl ? `

  states(v) {

      solid: { title: "SOLID", icon: "🧊", cls: "solid", text: "Particles packed tightly in fixed positions. They only vibrate in place." , dots: Array.from({length: 25}, (_, i) => [12 + (i % 5) * 19, 12 + Math.floor(i / 5) * 19]) },

  },
  bars(v) {
    return `<div class="bars">${v.items.map(it => `<div class="bar-row"><span class="bar-label">${esc(it.label)}</span><div class="bar-track"><span style="width:${it.value}%;background:${it.color || "var(--accent)"}"></span></div><span class="bar-value">${esc(it.text || it.value + "%")}</span></div>`).join("")}${v.note ? `<p class="bars-note">${v.note}</p>` : ""}</div>`;
  },
  numberline(v) {
    const from = v.from, to = v.to, step = v.step || 1, W = 680, pad = 34, y = 66;
    const x = n => pad + (n - from) / (to - from) * (W - 2 * pad);
    const fmt = n => n < 0 ? "−" + Math.abs(n) : String(n);
    let s = `<svg class="numberline" viewBox="0 0 ${W} 112" role="img" aria-label="Number line from ${fmt(from)} to ${fmt(to)}">`;
    s += `<line x1="6" y1="${y}" x2="${W - 6}" y2="${y}" class="nl-axis"/><polygon points="${W - 4},${y} ${W - 16},${y - 6} ${W - 16},${y + 6}" class="nl-arrow"/><polygon points="4,${y} 16,${y - 6} 16,${y + 6}" class="nl-arrow"/>`;
    for (let n = from; n <= to; n += step) {
      const hi = (v.highlight || []).includes(n);
      s += `<line x1="${x(n)}" y1="${y - 8}" x2="${x(n)}" y2="${y + 8}" class="nl-tick ${n === 0 ? "zero" : ""}"/><text x="${x(n)}" y="${y + 27}" class="nl-label ${hi ? "hi" : ""} ${n < 0 ? "neg" : ""}" text-anchor="middle">${fmt(n)}</text>`;
    }
    (v.jumps || []).forEach(j => {
      const x1 = x(j.from), x2 = x(j.to), mid = (x1 + x2) / 2, h = 34, c = j.color || "var(--accent)";
      s += `<path d="M${x1} ${y - 10} Q${mid} ${y - 10 - h * 1.7} ${x2} ${y - 10}" class="nl-jump" style="stroke:${c}"/><polygon points="${x2},${y - 6} ${x2 - 6},${y - 18} ${x2 + 6},${y - 18}" style="fill:${c}"/>${j.label ? `<text x="${mid}" y="${y - 10 - h - 6}" class="nl-jump-label" style="fill:${c}" text-anchor="middle">${esc(j.label)}</text>` : ""}`;
    });
    (v.points || []).forEach(p => {
      const c = p.color || "var(--accent)";
      s += `<circle cx="${x(p.at)}" cy="${y}" r="7" style="fill:${c}"/>${p.label ? `<text x="${x(p.at)}" y="${y + 44}" class="nl-point-label" style="fill:${c}" text-anchor="middle">${esc(p.label)}</text>` : ""}`;
    });
    return s + `</svg>`;
  },
  scripts(v) {
    const render = b => b.inner
      ? `<div class="sb-c cat-${b.cat}"><div class="sb-top">${b.text}</div><div class="sb-inner">${b.inner.map(render).join("")}</div><div class="sb-bottom"></div></div>`
      : `<div class="sb cat-${b.cat}${b.hat ? " hat" : ""}">${b.text}</div>`;
    return `<div class="scripts-row">${v.scripts.map(s => `<div class="script">${s.title ? `<strong>${esc(s.title)}</strong>` : ""}<div class="script-stack">${s.stack.map(render).join("")}</div>${s.note ? `<small>${s.note}</small>` : ""}</div>`).join("")}</div>`;
  },
  passage(v) {
    return `<article class="passage">${v.heading ? `<h3>${esc(v.heading)}</h3>` : ""}${v.paragraphs.map(p => `<p>${p}</p>`).join("")}</article>`;
  },
  orgchart(v) {
    return `<div class="orgchart"><div class="org-top" style="--card:${v.top.color || "var(--navy)"}"><strong>${esc(v.top.title)}</strong><span>${v.top.text}</span></div>
      <div class="org-branches">${v.branches.map(b => `<div class="org-node" style="--card:${b.color || "#64748b"}"><strong>${esc(b.title)}</strong><span>${b.text}</span></div>`).join("")}</div></div>`;
  }
};
Object.assign(VISUALS, CONFIG.extraVisuals || {});
function renderVisual(v) {
  if (!v) return "";
  const fn = VISUALS[v.type];
  return fn ? fn(v) : "";
}

/* ---------- Option shuffling (correct answer never sits in the same letter) ---------- */
const CATCH_ALL = /^(both|neither|none|all of|they are equal|cannot|no digit changes|nobody knows|nothing|ninguno|ninguna|las dos|los dos|todas|todos|nada|no se diferencian|no tiene)/i;
let currentOrder = [];
function shuffledOrder(question) {
  const idx = question.options.map((_, i) => i);
  if (question.fixed || CONFIG.shuffleOptions === false) return idx;
  const plain = o => String(o).replace(/<[^>]+>/g, "").trim();
  const main = idx.filter(i => !CATCH_ALL.test(plain(question.options[i])));
  const tail = idx.filter(i => CATCH_ALL.test(plain(question.options[i])));
  for (let i = main.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [main[i], main[j]] = [main[j], main[i]]; }
  return main.concat(tail);
}

/* ---------- Navigation ---------- */
function buildNavigation() {
  els.topicNav.innerHTML = topics.map((topic, index) => `
    <button class="topic-button" type="button" data-topic="${index}">
      <span class="topic-index">${String(index + 1).padStart(2, "0")}</span>
      <span>${esc(topic.title)}</span>
      <span class="topic-status ${progress[index] >= masteryTarget(topic) ? "done" : ""}" aria-label="${progress[index] >= masteryTarget(topic) ? UI.done : UI.pending}"></span>
    </button>`).join("");
  els.topicSelect.innerHTML = topics.map((topic, index) => `<option value="${index}">${index + 1}. ${esc(topic.title)}</option>`).join("");
  els.topicNav.querySelectorAll("button").forEach(button => button.addEventListener("click", () => selectTopic(Number(button.dataset.topic))));
}

function renderLessonVisual(topic) {
  const list = topic.visuals || (topic.visual ? [topic.visual] : []);
  if (!list.length) { els.lessonVisual.classList.add("hidden"); els.lessonVisual.innerHTML = ""; return; }
  els.lessonVisual.classList.remove("hidden");
  els.lessonVisual.innerHTML = list.map((v, i) => `<div class="visual-block">${v.title ? `<h2>${esc(v.title)}</h2>` : ""}${v.intro ? `<p>${v.intro}</p>` : ""}${renderVisual(v)}</div>`).join("");
}

function renderQuestionVisual(question) {
  if (!question.visual) { els.questionVisual.classList.add("hidden"); els.questionVisual.innerHTML = ""; return; }
  els.questionVisual.classList.remove("hidden");
  els.questionVisual.innerHTML = `${question.visual.title ? `<p class="question-visual-title">${esc(question.visual.title)}</p>` : ""}${renderVisual(question.visual)}`;
}

function selectTopic(index) {
  activeTopic = index;
  const topic = topics[index];
  els.weekLabel.textContent = topic.week;
  els.topicTitle.textContent = topic.title;
  els.topicSummary.textContent = topic.summary;
  els.topicNumber.textContent = String(index + 1).padStart(2, "0");
  els.topicDefinition.innerHTML = topic.definition;
  els.stepsTitle.textContent = topic.stepsTitle || UI.stepsTitle;
  els.topicSteps.innerHTML = topic.steps.map(step => `<li><span>${step}</span></li>`).join("");
  els.exampleTitle.textContent = topic.exampleTitle || UI.exampleTitle;
  els.topicExample.innerHTML = topic.example;
  els.topicTip.innerHTML = topic.tip;
  renderLessonVisual(topic);
  els.topicSelect.value = index;
  els.topicBest.textContent = progress[index] !== undefined ? `${progress[index]}/${topic.questions.length}` : "";
  document.querySelectorAll(".topic-button").forEach((button, i) => button.classList.toggle("active", i === index));
  els.quizIntroText.textContent = UI.quizIntro.replace("{n}", topic.questions.length);
  showMode("learn");
  resetQuiz();
  if (history.replaceState) history.replaceState(null, "", `#t${index + 1}`);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function showMode(mode) {
  const learn = mode === "learn";
  els.learnPanel.classList.toggle("hidden", !learn);
  els.practicePanel.classList.toggle("hidden", learn);
  els.learnTab.classList.toggle("active", learn);
  els.practiceTab.classList.toggle("active", !learn);
  els.learnTab.setAttribute("aria-selected", String(learn));
  els.practiceTab.setAttribute("aria-selected", String(!learn));
}

function resetQuiz() {
  questionIndex = 0; score = 0; answered = false;
  els.quizIntro.classList.remove("hidden");
  els.quizArea.classList.add("hidden");
  els.quizResult.classList.add("hidden");
}

function startQuiz() {
  questionIndex = 0; score = 0;
  els.quizIntro.classList.add("hidden");
  els.quizResult.classList.add("hidden");
  els.quizArea.classList.remove("hidden");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const topic = topics[activeTopic];
  const question = topic.questions[questionIndex];
  const totalQuestions = topic.questions.length;
  els.questionCount.textContent = UI.questionCount.replace("{i}", questionIndex + 1).replace("{n}", totalQuestions);
  els.liveScore.textContent = UI.score.replace("{s}", score);
  els.questionBar.style.width = `${((questionIndex + 1) / totalQuestions) * 100}%`;
  renderQuestionVisual(question);
  els.questionContext.innerHTML = question.context || "";
  els.questionContext.classList.toggle("hidden", !question.context);
  els.questionPrompt.innerHTML = question.prompt;
  els.feedback.className = "feedback hidden";
  els.nextQuestion.classList.add("hidden");
  currentOrder = shuffledOrder(question);
  els.answerList.innerHTML = currentOrder.map((orig, index) => `
    <button class="answer-button" type="button" data-answer="${index}" data-orig="${orig}">
      <span class="answer-letter">${letters[index]}</span><span>${question.options[orig]}</span>
    </button>`).join("");
  els.answerList.querySelectorAll("button").forEach(button => button.addEventListener("click", () => answerQuestion(Number(button.dataset.answer))));
}

function answerQuestion(selected) {
  if (answered) return;
  answered = true;
  const question = topics[activeTopic].questions[questionIndex];
  const correct = currentOrder[selected] === question.answer;
  if (correct) score++;
  els.liveScore.textContent = UI.score.replace("{s}", score);
  [...els.answerList.children].forEach((button, index) => {
    button.disabled = true;
    if (currentOrder[index] === question.answer) button.classList.add("correct");
    if (index === selected && !correct) button.classList.add("wrong");
  });
  els.feedback.className = `feedback ${correct ? "good" : "bad"}`;
  els.feedback.innerHTML = `<strong>${correct ? UI.correct : UI.wrong}</strong>${question.feedback}`;
  els.nextQuestion.textContent = questionIndex === topics[activeTopic].questions.length - 1 ? UI.seeResult : UI.nextQuestion;
  els.nextQuestion.classList.remove("hidden");
  els.nextQuestion.focus({ preventScroll: true });
}

function advanceQuestion() {
  if (questionIndex < topics[activeTopic].questions.length - 1) { questionIndex++; renderQuestion(); }
  else showResult();
}

function showResult() {
  els.quizArea.classList.add("hidden");
  els.quizResult.classList.remove("hidden");
  const topic = topics[activeTopic];
  const totalQuestions = topic.questions.length;
  els.resultScore.textContent = `${score}/${totalQuestions}`;
  const level = score >= masteryTarget(topic) ? 2 : score >= Math.ceil(totalQuestions * 0.6) ? 1 : 0;
  els.resultTitle.textContent = UI.results[level][0];
  els.resultMessage.textContent = UI.results[level][1];
  progress[activeTopic] = Math.max(progress[activeTopic] || 0, score);
  saveProgress();
  refreshProgress();
}

function refreshProgress() {
  const mastered = topics.filter((topic, index) => progress[index] >= masteryTarget(topic)).length;
  els.progressText.textContent = UI.progress.replace("{m}", mastered).replace("{n}", topics.length);
  els.progressBar.style.width = `${(mastered / topics.length) * 100}%`;
  buildNavigation();
  document.querySelectorAll(".topic-button").forEach((button, i) => button.classList.toggle("active", i === activeTopic));
  els.topicBest.textContent = progress[activeTopic] !== undefined ? `${progress[activeTopic]}/${topics[activeTopic].questions.length}` : "";
}

els.learnTab.addEventListener("click", () => showMode("learn"));
els.practiceTab.addEventListener("click", () => showMode("practice"));
els.startPractice.addEventListener("click", () => { showMode("practice"); window.scrollTo({ top: 0, behavior: "smooth" }); });
els.beginQuiz.addEventListener("click", startQuiz);
els.nextQuestion.addEventListener("click", advanceQuestion);
els.retryQuiz.addEventListener("click", startQuiz);
els.nextTopic.addEventListener("click", () => selectTopic((activeTopic + 1) % topics.length));
els.topicSelect.addEventListener("change", event => selectTopic(Number(event.target.value)));
/* Two-click reset (no confirm() dialog: it is blocked inside the artifact viewer). */
let resetArmed = null;
function disarmReset() { clearTimeout(resetArmed); resetArmed = null; els.resetProgress.textContent = els.resetProgress.dataset.label || els.resetProgress.textContent; els.resetProgress.classList.remove("armed"); }
els.resetProgress.addEventListener("click", () => {
  if (resetArmed) { disarmReset(); progress = {}; saveProgress(); refreshProgress(); resetQuiz(); return; }
  els.resetProgress.dataset.label = els.resetProgress.textContent;
  els.resetProgress.textContent = UI.resetConfirm;
  els.resetProgress.classList.add("armed");
  resetArmed = setTimeout(disarmReset, 5000);
});
window.addEventListener("hashchange", () => {
  const m = location.hash.match(/^#t(\d+)(p?)$/);
  if (!m) return;
  const i = Math.min(Math.max(parseInt(m[1], 10) - 1, 0), topics.length - 1);
  if (i !== activeTopic) selectTopic(i);
  if (m[2]) { showMode("practice"); startQuiz(); }
});
document.querySelector(".brand").addEventListener("click", event => { event.preventDefault(); selectTopic(0); });

buildNavigation();
refreshProgress();
const initialHash = location.hash;
const startAt = Math.min(Math.max(parseInt((initialHash.match(/#t(\d+)/) || [])[1] || 1, 10) - 1, 0), topics.length - 1);
selectTopic(startAt);
if (/#t\d+p/.test(initialHash)) { showMode("practice"); startQuiz(); }

  </script>
</body>
</html>
