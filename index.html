<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camilo Study Sites</title>
  <style>
    :root { color-scheme: light; --navy: #0c2344; --ink: #18243a; --muted: #64738a; --paper: #f5f7fb; --line: #dbe2ec; --accent: #2a9d8f; --accent-light: #dff5f1; --yellow: #ffc857; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6; }
    header { background: var(--navy); color: #fff; padding-block: 28px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
    header div { max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .mark { width: 46px; height: 46px; border-radius: 13px; background: var(--yellow); color: var(--navy); display: grid; place-items: center; font-weight: 900; font-size: 1.3rem; }
    header strong { display: block; font-size: 1.15rem; }
    header small { color: #bfcce0; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; font-weight: 700; }
    main { max-width: 820px; margin: 0 auto; padding-block: 36px 60px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
    h1 { margin: 0 0 6px; font-size: clamp(1.7rem, 4vw, 2.4rem); letter-spacing: -.03em; color: var(--navy); text-wrap: balance; }
    p.lead { margin: 0 0 28px; color: var(--muted); }
    .site { display: grid; grid-template-columns: 56px 1fr auto; gap: 16px; align-items: center; padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 16px; text-decoration: none; color: inherit; box-shadow: 0 10px 30px rgba(21,49,91,.06); }
    .site + .site { margin-top: 12px; }
    .site:hover { border-color: var(--accent); }
    .site .mark { background: var(--accent); color: #fff; }
    .site strong { display: block; color: var(--navy); font-size: 1.05rem; }
    .site span { color: var(--muted); font-size: .9rem; }
    .site em { font-style: normal; font-weight: 800; color: var(--accent); white-space: nowrap; }
    @media (max-width: 560px) { .site { grid-template-columns: 46px 1fr; } .site em { grid-column: 2; } }
  </style>
</head>
<body>
  <header><div><span class="mark">C</span><div><strong>Camilo · Study Sites</strong><small>Grade 4 · Aspaen Altamar</small></div></div></header>
  <main>
    <h1>Interactive study sites</h1>
    <p class="lead">Pick a subject. Each site has a Learn tab and a Practice quiz for every topic. Your progress is saved in this browser.</p>
    <a class="site" href="science-mission-2/"><span class="mark">Sc</span><div><strong>Science Mission 2</strong><span>The atom · states of matter · changes of matter · the skeleton · muscles</span></div><em>Open →</em></a>
  </main>
</body>
</html>
